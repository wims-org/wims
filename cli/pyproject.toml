[project]
name = "wims-cli"
version = "0.1.0"
description = "A cli client for WIMS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.1",
    "prettytable>=3.17.0",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "xdg>=6.0.0",
]


[project.scripts]
wims = "cli:main"

[tool.uv]
package = true

