services:
  playwright:
    build: ./integration/
    volumes:
      - ./integration/playwright-results:/workspaces/integration/playwright-results
    environment:
      - CI=true
      - BACKEND_URL=http://wims/api
    depends_on:
      - wims

  db:
    volumes:
      # Reset the volume each restart
      - type: tmpfs
        target: /var/lib/mysql
        tmpfs:
          mode: 0777
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
